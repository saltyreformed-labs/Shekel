# Shekel Budget App -- the app image, built from the checkout's Dockerfile
#
# The one recipe for building the app image (ruling plan#2752).  The release
# (docker-publish.yml's build-and-push) pushes what it builds and signs its
# digest; ci.yml's ``image`` job loads it into the runner's docker and checks
# what it holds, so a change that breaks the build fails a pull request
# rather than a release (task plan#2366); and updates.yml's ``scan`` job
# loads dev's image into the runner's docker to scan it for known CVEs each
# week (plan#2444).  The pinned build action and its
# settings are here once; each caller says only whether the image is pushed
# or loaded, and its tags and labels.  What each caller's job holds is its
# own: its runner label, its environment, and the steps before this one.
# The three callers' jobs run on one label and set up no builder
# (tools/ci/test_ci_image.py refuses ``docker/setup-buildx-action`` by name
# in the release's job and reads every step of the image job, and
# tools/ci/test_updates_workflow.py every step of the scan; another way of
# setting one up, or a ``BUILDX_`` variable in a job's environment, is
# review's to hold).
#
# NO LAYER CACHE, read or written (ruling plan#2471): the image is built
# from the checkout and what it pins and downloads, never from layers
# another run left (.github/actions/install-lock's header says why).
#
# THE RUNNER'S OWN BUILDER (ruling plan#2742): this action sets up no
# builder, and no caller's job does, so the build runs on the runner's
# Docker Engine and its own BuildKit, and no BuildKit image is pulled.
#
# THE PROVENANCE RECORD AT mode=max, asked for by name (rulings plan#2746,
# plan#2751), so the record rests on neither action's defaults.  Unasked,
# build-push-action adds a record of its own only when the builder's
# BuildKit version passes its check, which on the engine's builder wants a
# ``-moby`` suffix the version buildx reads lacks (@docker/actions-toolkit
# 0.100.0, read; unmeasured on a runner), and buildx's own default is the
# minimal record, or none on an image store that cannot attach one.  Asked
# for, it holds the build's definition and names the run attempt's URL as
# its builder id.  It holds none of the GitHub Actions fields a Buildx
# container builder added (the actor, the push event, the runner image);
# the commit, ref, trigger, workflow and run are in the certificate the
# release's signing step records (both read at the image of 2026-10-29).  A
# store that cannot attach the record refuses the build before any push, so
# the release fails closed and production keeps its image, and the image
# job, on the same runner label, meets the same refusal at a pull request
# first.  That refusal is read in buildx v0.38.1's build/opt.go, which
# refuses an attestation on a ``docker`` driver that cannot store one
# (2026-11-03), not measured: no daemon here runs the classic store.
#
# build-push-action's post step also uploads a build's record, the
# provenance in it, as an artifact of the run (the release of 2026-10-29
# uploaded one, on its container builder; on the engine's builder,
# unmeasured until this action first runs).

name: Build the app image
description: The app image from the checkout's Dockerfile, pushed or loaded as its caller says.

inputs:
  push:
    description: "``true`` to push the image to its registry, as the release does; else ``false``."
    required: true
  load:
    description: "``true`` to load the image into the runner's docker, as the image job does; else ``false``."
    required: true
  tags:
    description: The image's tags, one to a line.
    required: true
  labels:
    description: The image's labels, one to a line; none unless given.
    required: false
    default: ""

outputs:
  digest:
    description: The digest of the image built, the one the release signs.
    value: ${{ steps.build.outputs.digest }}

runs:
  using: composite
  steps:
    - name: Build the image
      id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        push: ${{ inputs.push }}
        load: ${{ inputs.load }}
        tags: ${{ inputs.tags }}
        labels: ${{ inputs.labels }}
        provenance: mode=max
