# Dependabot -- the standing answer to "who notices a stale pin" (developer
# ruling 2026-09-19: pinned dependencies stay pinned; drift arrives as
# CI-gated pull requests instead of waiting for a human to run pip-audit).
#
# Dependabot moves the images and the CI actions.  Every Python package is
# the Monday refresh's (.github/workflows/updates.yml, after this file's
# 06:00 run; ruling plan#2351), which moves every package uv.lock holds,
# indirect ones included, within pyproject.toml's ranges and exclusions, and
# opens each move that needs a card (a new major among them) as a pull
# request of its own.  So no entry here
# covers Python: a pip entry would find only pyproject.toml and could raise
# a floor there without moving uv.lock, which ``uv sync --locked`` refuses.
#
# Every pin these entries move is exact (Dockerfile and compose
# ``image:tag@sha256:`` digests, workflow ``uses:`` commit SHAs with a
# version comment), and Dependabot rewrites each in place, digest and
# comment included.
#
# Who lands these PRs is the daily queue (updates.yml's queue job; rulings
# plan#2351 and plan#2449): it puts a Dependabot pull request into dev's
# merge queue, with no card, once the landing check's own walk finds it
# moves pinned versions alone, none across a major, and every check at its
# head passed.  A major waits for a session to claim a card and take its
# change (ruling plan#2450), so each opens alone: in a group with minor and
# patch moves it would hold all of them back.  A security update, which
# Dependabot opens into main whatever ``target-branch`` says, is retargeted
# to dev by the same queue and judged there on its next run.
#
# Every ``ignore`` below is a developer ruling written as configuration
# rather than prose, so the first run after this file lands proposes
# nothing the rulings exclude.  Each entry also states an explicit
# ``cooldown`` (zizmor's dependabot-cooldown rule): a release is proposed
# only once it has been public for a week, which is the window in which a
# hijacked or broken release is usually pulled upstream.
version: 2
updates:
  # The application image's base (Dockerfile FROM ... @sha256).  A digest
  # PR rewrites the FROM lines only, and no comment beside them restates
  # what they pin, so nothing is left to re-measure (ruling plan#2443): the
  # build's own upgrade keeps OpenSSL at Debian's newest, and the runtime
  # image deletes the base image's pip.  The uv stage's FROM line
  # moves here too: it is the one home of uv's version and digest, and the
  # stage is what .github/actions/dockerfile-uv exports for every CI job
  # that runs uv.  Each image opens a PR of its own, a major included.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    target-branch: dev
    cooldown:
      default-days: 7
    ignore:
      # The Python version moves only in its own deliberate change: the
      # Dockerfile's FROM tags and .python-version, which every CI job and
      # the local venv read, in ONE pull request, after X-bi-6-4d's release
      # (developer rulings R-BAL292 and R-BAL297, 2026-10-14).  A tag move
      # proposed here alone would ship one Python while CI tests another.
      # Digest updates within the current tag still arrive.
      - dependency-name: python
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  # The compose files' service images (postgres, valkey, nginx pins).  The
  # postgres and valkey digests must each move in docker-compose.yml and
  # docker-compose.dev.yml in the SAME commit (their comments say so), so
  # both files sit under one directory entry.  Each image opens a PR of its
  # own, a major included.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    target-branch: dev
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions: SHA-pinned ``uses:`` lines with a version comment;
  # Dependabot updates both.  jactionlint and zizmor gate the result.  ``/``
  # reaches the workflows alone (and a root action.yml, which there is
  # not), so the local composite actions' directories are listed too.
  # Minor and patch moves are grouped into one weekly PR; a major is left
  # out of the group and opens alone.
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    target-branch: dev
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "ci(deps)"
