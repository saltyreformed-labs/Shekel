# Dependabot -- the standing answer to "who notices a stale pin" (developer
# ruling 2026-09-19: pinned dependencies stay pinned; drift arrives as
# CI-gated pull requests instead of waiting for a human to run pip-audit).
#
# Every pin in this repo is exact (requirements*.txt ``==``, Dockerfile and
# compose ``image@sha256:`` digests, workflow ``uses:`` commit SHAs with a
# version comment), and Dependabot rewrites each in place, digest and
# comment included.  Who lands these PRs is ruled but not yet built: a
# grouped minor or patch update is to merge itself on green (R-BAL295), but a
# bump of a file production runs lands only on a card a session takes it
# onto (R-BAL362, which amends it), so X-em (plan#1183) re-derives the
# auto-merge at its claim.  Until it lands no session is named to land
# them, and they wait.  A major version arrives as its own PR so its
# changelog is read on its own.
#
# Every ``ignore`` below is a developer ruling written as configuration
# rather than prose, so the first run after this file lands proposes
# nothing the rulings exclude.  Each entry also states an explicit
# ``cooldown`` (zizmor's dependabot-cooldown rule): a release is proposed
# only once it has been public for a week, which is the window in which a
# hijacked or broken release is usually pulled upstream.
version: 2
updates:
  # Python: requirements.txt (runtime) and requirements-dev.txt (tools),
  # both at the repo root.  Minor and patch moves are grouped into one
  # weekly PR; a major is left out of the group and opens alone.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    target-branch: dev
    cooldown:
      default-days: 7
    groups:
      python-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # (rumdl and djlint were held here until the 2026-09-20 UI leaf read
      # their findings and moved both pins; a lint-tool release that flags
      # unchanged files now arrives as a red grouped PR, which is the
      # signal to read its findings the same way.)
      # rumdl 0.2.79 and 0.3.0 re-wrap a checkbox item that has nested
      # sub-items wrongly: the "[x] " counts as zero width, so their own
      # fix writes lines over 100 characters, and one item has no form
      # 0.2.79 accepts at all (developer ruling R-BAL332, 2026-10-20).
      # Exact versions, not a range: every later release is still
      # proposed, and polyglot-lint judges it.
      - dependency-name: rumdl
        versions: ["0.2.79", "0.3.0"]
    commit-message:
      prefix: "chore(deps)"

  # The application image's base (Dockerfile FROM ... @sha256).  A digest
  # PR rewrites the FROM lines only, and no comment beside them restates
  # what they pin, so nothing is left to re-measure (ruling plan#2443): the
  # build's own upgrade keeps OpenSSL at Debian's newest, and the runtime
  # image deletes the base image's pip.  The uv stage's FROM line
  # moves here too: it is the one home of uv's version and digest, which
  # every CI job's .github/actions/install-lock reads.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    target-branch: dev
    cooldown:
      default-days: 7
    ignore:
      # The Python version moves only in its own deliberate change: the
      # Dockerfile's FROM tags and .python-version, which every CI job and
      # the local venv read, in ONE pull request, after X-bi-6-4d's release
      # (developer rulings R-BAL292 and R-BAL297, 2026-10-14).  A tag move
      # proposed here alone would ship one Python while CI tests another.
      # Digest updates within the current tag still arrive.
      - dependency-name: python
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  # The compose files' service images (postgres, valkey, nginx pins).  The
  # postgres and valkey digests must each move in docker-compose.yml and
  # docker-compose.dev.yml in the SAME commit (their comments say so), so
  # both files sit under one directory entry.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    target-branch: dev
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions: SHA-pinned ``uses:`` lines with a version comment;
  # Dependabot updates both.  jactionlint and zizmor gate the result.  ``/``
  # reaches the workflows alone (and a root action.yml, which there is
  # not), so the local composite actions' directories are listed too.
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    target-branch: dev
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
