# Build and publish Shekel Docker image to GitHub Container Registry.
#
# Triggers:
#   - Push to main → tags as "latest"
#   - Mondays at 08:23 UTC → main's newest commit rebuilt, tagged "latest"
#     (metadata-action reads a schedule as the default branch's)
#   - No git tag (ruling plan#3741): shekel-deploy accepts only an image
#     signed by this file at refs/heads/main, so a tag's build was an image
#     nothing deploys, and metadata-action's ``latest=auto`` flavor tagged
#     it "latest" too.
#
# THE WEEKLY REBUILD (ruling plan#3724).  Each build takes Debian's newest
# OpenSSL, libpq and Postgres client (the Dockerfile's apt-get lines, with no
# layer cache: .github/actions/build-image), so a week with no release would
# otherwise leave a Debian fix out of the image production can deploy.  The
# schedule's run builds, pushes and signs exactly as a push to main does,
# its certificate naming this file at refs/heads/main as a release's does, so
# shekel-deploy verifies it the same way.  It reaches production only by a
# deploy, the next release's or a ``shekel-deploy`` run by hand: no build of
# this workflow deploys anything.  WUD, watching ``shekel-prod-app`` by
# digest (docker-compose.yml), reports a rebuilt "latest" production does not
# run at its daily scan, 09:00 New York, after this one.  Off the top of the
# hour, when GitHub may drop queued scheduled runs.  In a public repository
# GitHub turns a schedule off after 60 days with no repository activity
# (as tax-law.yml states); a release, a merge into main, is activity.
#
# One build at a time (``concurrency`` below): a rebuild and a release
# build never run together, and no run cancels another, each waiting its
# turn.  GitHub does not guarantee the order they wait in, so the build's
# second step is what holds "latest" to main: it refuses a run whose commit
# is no longer main's tip when its turn comes, whatever order runs are made
# in (a re-run of an older run among them), so "latest" only ever moves
# forward along main.  A scheduled run whose build failed opens the update
# alert's issue mentioning the developer (the ``alert`` job); a release
# watches its own build.
#
# Audit Commit C-36 (findings F-060, F-155):
#   - Image is digest-pinned downstream by deploy/docker-compose.prod.yml
#     (the workflow output below carries the digest the operator pastes
#     into SHEKEL_IMAGE_DIGEST in /opt/docker/shekel/.env).
#   - Image is signed with Cosign keyless OIDC after every successful
#     push.  The signature is uploaded to GHCR alongside the image and
#     can be verified with:
#         cosign verify \
#             --certificate-identity-regexp \
#             '^https://github\.com/saltyreformed-labs/Shekel/\.github/workflows/docker-publish\.yml@refs/heads/main$' \
#             --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#             ghcr.io/saltyreformed-labs/shekel@sha256:<digest>

name: Build & Publish Docker Image

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 8 * * 1"

# One run at a time, and none cancelled (the header's THE WEEKLY REBUILD).
# ``queue: max`` lets up to 100 runs wait.  GitHub's default keeps one
# waiting and cancels it for the next, so a re-run of an older run could
# cancel the waiting build of main's newest commit and then refuse at the
# tip step, leaving nothing built and no alert.  The waiting runs go first
# in, first out, by when each began to wait, an order GitHub does not
# guarantee; the build's tip step holds a run that comes out of it.  One
# group, as every run is of main and pushes "latest".
concurrency:
  group: release-image
  cancel-in-progress: false
  queue: max

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Next year's tax law, before any image is built ──────────────
  # From December 1 no release image is built until next year's tax law is
  # in app/tax_law/ (plan step salary:X-at-4; rulings salary:R-SAL74,
  # R-SAL86, R-SAL88).  ci.yml's ``tax-law`` job refuses the same thing on a
  # pull request, judged when the PR is pushed and again on the merge-queue
  # group that lands it (main's included, measured 2026-10-23), but a group
  # is judged before it lands: one judged green on November 30 could land on
  # December 1, and the weekly rebuild runs on no pull request at all.  This
  # check is judged when the release is BUILT, so neither can ship one.  A
  # December merge without next year leaves production on the previous image
  # until the law is added (R-SAL88); the code on main runs ahead of it
  # meanwhile.
  #
  # "Re-run failed jobs" re-runs only the build and REUSES this job's result,
  # so a check that passed on November 28 would otherwise wave through a
  # build re-run on December 3.  So this job also hands the build the instant
  # the refusal starts for the law it checked (``refuse_from``), and the
  # build's first step refuses once that instant has passed.  The date rule
  # and the timezone stay in Python; the build compares two integers.
  #
  # Its OWN job, with read-only permissions, rather than a step of the build:
  # installing the lock's packages runs third-party install code, and the build
  # job holds ``id-token: write`` (it signs images) and ``packages: write``.
  # ``build-and-push`` NEEDS this job, so a failure here builds nothing.
  tax-law:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      refuse_from: ${{ steps.refuse_from.outputs.epoch }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runtime set only: importing the law imports the ``app`` package,
      # and the check needs nothing the dev tools add.
      - name: Install the lock
        uses: $/.github/actions/install-lock
        with:
          install: runtime

      # The real clock, in the display timezone: fails from December 1 while
      # next year is missing (scripts/check_tax_law.py).
      - name: Is next year's tax law in? (refuses from December 1)
        run: python scripts/check_tax_law.py refuse

      # The Unix time this law's refusal starts (midnight Eastern), for the
      # build's own check below.  An assignment, so a failing script fails
      # the step rather than handing the build an empty value.
      - name: When does the refusal start?
        id: refuse_from
        shell: bash
        run: |
          epoch="$(python scripts/check_tax_law.py refuse --starts-epoch)"
          echo "epoch=${epoch}" >> "${GITHUB_OUTPUT}"

  build-and-push:
    needs: tax-law
    runs-on: ubuntu-26.04
    permissions:
      # ``id-token: write`` is required for sigstore keyless signing
      # via OIDC (the Action mints a short-lived OIDC token from the
      # GitHub provider, which Fulcio exchanges for an X.509
      # signing certificate).  Without this scope, ``cosign sign``
      # fails with a 403 from the OIDC token endpoint.
      id-token: write
      contents: read
      packages: write

    steps:
      # FIRST, before any checkout or login: refuse once the tax-law refusal
      # has started, even when this job is a re-run whose ``tax-law`` result
      # was judged before it (R-SAL88).  The ONLY way through is a well-formed
      # instant still in the future: anything else -- a missing or malformed
      # value, or a comparison that errors (``set -e`` does not fire inside an
      # ``if``) -- falls to a refusal.  ``shell: bash`` makes GitHub run it
      # as ``bash --noprofile --norc -eo pipefail``, the invocation
      # tools/ci/test_ci_workflow.py RUNS this text under, with planted
      # values.
      - name: Is it still before the tax-law refusal?
        shell: bash
        env:
          REFUSE_FROM: ${{ needs.tax-law.outputs.refuse_from }}
        run: |
          set -euo pipefail
          # One to eighteen ASCII digits: the bracket lists them, so no locale
          # widens it, and eighteen digits is a number bash can compare.
          if ! [[ "${REFUSE_FROM}" =~ ^[0123456789]{1,18}$ ]]; then
              echo "Refusing to build: the tax-law check handed no usable refusal instant ('${REFUSE_FROM}')." >&2
              echo "That is a fault in the check, not the law: fix it, then re-run all jobs." >&2
              exit 1
          fi
          now="$(date +%s)"
          if [ "${now}" -lt "${REFUSE_FROM}" ]; then
              echo "Before the tax-law refusal (${now} < ${REFUSE_FROM})."
              exit 0
          fi
          echo "Refusing to build: the tax-law refusal started at ${REFUSE_FROM} (Unix time) and it is ${now}." >&2
          echo "Next year's tax law is missing, so this commit cannot ship; the release that adds it builds on its own push." >&2
          exit 1

      # SECOND, still before any checkout or login: refuse a run whose commit
      # is no longer main's tip (ruling plan#3724).  "latest" is what
      # ``shekel-deploy`` deploys when handed no digest, so it must never
      # name an older commit than main's, and every run pushes it: a push to
      # main and the schedule (the header's Triggers).  The concurrency group
      # runs builds one at a time and cancels none, in an order GitHub does
      # not guarantee; this step holds a run that is no longer of main's tip
      # when its turn comes, a re-run of an older run among them, whose
      # commit's newer successor has a run of its own.  A tip that cannot be
      # read refuses: ``set -e`` fails the assignment, and an empty answer is
      # no match.  tools/ci/test_release_image_workflow.py RUNS this text
      # with a stand-in ``git``.
      - name: Is this still main's newest commit?
        shell: bash
        env:
          SHA: ${{ github.sha }}
          REMOTE: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          set -euo pipefail
          tip="$(git ls-remote --exit-code "${REMOTE}" refs/heads/main)"
          tip="${tip%%[[:space:]]*}"
          if [ "${tip}" = "${SHA}" ]; then
              echo "${SHA} is main's newest commit."
              exit 0
          fi
          echo "Refusing to build: this run is of ${SHA}, and main's newest commit is '${tip}'." >&2
          echo "Its own run builds that one; latest must never name an older commit." >&2
          exit 1

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The build, push, and sign steps authenticate via docker
          # login and OIDC, not git, so the checkout token need not
          # persist in .git/config (zizmor artipacked hardening).
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        # The installer's pinned commit is cosign's one home (ruling
        # plan#2442): given no ``cosign-release``, it installs its own
        # default cosign, the binary it checks against the sha256 the
        # action holds at that commit (read 2026-10-31), so an update of
        # this line moves cosign with it and nothing else names a version
        # to fall behind.  The same cosign runs the ``sign`` step below.
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and push image
        # ``id`` lets the next step reference ``steps.build.outputs.digest``
        # -- the immutable sha256 digest of the manifest just pushed.
        # We sign by digest (cosign best practice; signing by tag
        # would let a future tag-swap detach the signature from the
        # image bytes it attests to).
        #
        # The build is .github/actions/build-image's, the one recipe ci.yml's
        # ``image`` job builds by too (ruling plan#2752); its header says what
        # the two share and why.
        id: build
        uses: $/.github/actions/build-image
        with:
          push: true
          load: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Sign image with Cosign (keyless OIDC)
        # ``cosign sign`` with no ``--key`` uses the sigstore keyless
        # flow: the workflow's OIDC identity is exchanged for a
        # short-lived Fulcio cert, which signs the image, and the
        # signature is uploaded to the registry.  ``--yes`` skips
        # the interactive confirmation prompt that would otherwise
        # block CI.
        #
        # We sign every tag the metadata action produced.  Each ``sign``
        # invocation works against the digest, so the multi-tag fanout
        # records one signature per (tag, digest) pair.
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
              [ -z "$tag" ] && continue
              echo "Signing ${tag}@${DIGEST}"
              cosign sign --yes "${tag}@${DIGEST}"
          done <<< "${TAGS}"

      - name: Emit image digest for downstream pinning
        # Print the digest in a discoverable spot so the operator can
        # paste it into /opt/docker/shekel/.env's SHEKEL_IMAGE_DIGEST
        # variable.  Also write it to the workflow summary so the
        # latest digest is one click away from the Actions UI.
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          echo "Image digest: ${DIGEST}"
          {
              echo "## Image digest"
              echo ""
              echo "Pin this digest in \`/opt/docker/shekel/.env\`:"
              echo ""
              echo "\`\`\`"
              echo "SHEKEL_IMAGE_DIGEST=${DIGEST}"
              echo "\`\`\`"
              echo ""
              echo "Verify with:"
              echo ""
              echo "\`\`\`"
              echo "cosign verify \\"
              echo "    --certificate-identity-regexp \\"
              echo "    '^https://github\.com/${{ github.repository }}/\.github/workflows/docker-publish\.yml@refs/heads/main\$' \\"
              echo "    --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
              echo "    ghcr.io/${{ github.repository }}@${DIGEST}"
              echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # A failed weekly rebuild, told to the developer (rulings plan#3724,
  # plan#3742): the update alert's issue (tools/update/alert.py, which
  # updates.yml's alert opens too), mentioning him, linking the run and
  # naming each job's result: the issue plan#3552 has ``quill sync`` file as
  # a card (rulings plan#3619, plan#3622).  Only a scheduled run's, as a
  # release watches its own build, and only when the build failed: the
  # tax-law job's refusal skips the build and opens none, as the in-app
  # banner, tax-law.yml's weekly email and ci.yml's refusal of every pull
  # request report a missing tax law already (ruling plan#3742).  So the
  # tax-law job failing on an outside fault, its install's, opens none
  # either.  Two failed builds open one that is no fault in the image: a
  # scheduled run overtaken by a push to main while it waited, which its
  # tip step refuses, and a re-run by hand after December 1 that the
  # build's own tax-law step refuses.  A build cancelled, by hand or at
  # GitHub's own 360 minutes (the build carries no time limit of its own,
  # plan#2361's to rule), opens none: ``failure()`` is true only when a job
  # it needs failed.  It installs nothing, so an install's failure cannot
  # stop it: main's own code on the runner's Python with the standard
  # library alone, the issue sent by the runner's gh.  It publishes nothing
  # and holds only the workflow's own token, widened to issues for this job
  # alone, so it needs no tax-law check of its own.
  alert:
    needs: [tax-law, build-and-push]
    if: failure() && github.event_name == 'schedule' && needs.build-and-push.result == 'failure'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Open an issue naming the failed run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TAX_LAW: ${{ needs.tax-law.result }}
          BUILD_AND_PUSH: ${{ needs.build-and-push.result }}
        run: >-
          python3 -S -m tools.update.alert "${RUN}"
          "tax-law=${TAX_LAW}" "build-and-push=${BUILD_AND_PUSH}"
