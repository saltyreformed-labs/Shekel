# Local pre-commit hooks for Shekel. Install once with `pre-commit install`,
# which installs each hook type default_install_hook_types names into the
# repository's shared hooks directory, so every worktree of it runs them.
#
# These mirror the CI gate so a regression is caught before the commit lands,
# not at PR time. The Claude Code per-edit and Stop hooks are the in-session
# enforcement layer; this is the layer for commits made outside a Claude session.
#
# NOTE: in the Claude Code web/remote flow the container performs the commit, so
# pre-commit only fires there if a SessionStart hook runs `pre-commit install`.
# Its primary value is local developer commits; CI remains the enforced gate.
#
# The two message stages run quill's commit hook alone (quill-task below).
# Every other hook names no stage and so takes default_stages: without it,
# pre-commit would run each at every installed stage, three times a commit.
default_install_hook_types: [pre-commit, prepare-commit-msg, commit-msg]
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: pylint-app
        name: pylint app/ (custom checkers + design-smell floor)
        entry: pylint
        language: system
        types: [python]
        files: ^app/.*\.py$
        pass_filenames: false
        # Whole-package run: duplicate-code (R0801) is cross-file and cannot be
        # checked per-file. --fail-under=10 mirrors CI's lock-in floor
        # (docs/audits/pylint-cleanup/plan.md Phase 5; app/ is at a clean
        # 10.00/10). The shekel-* symbols are hard failures -- zero violations,
        # so this gives immediate protection for the financial-correctness rules.
        args:
          - app/
          - --fail-under=10
          - --fail-on=E,F,shekel-decimal-from-float,shekel-refname-compare,shekel-bare-money-quantize,shekel-disable-rationale,shekel-transaction-status-bypass,shekel-ledger-model-bypass,shekel-unclassified-fenced-export,shekel-private-module-import
      - id: pylint-scripts
        name: pylint scripts/ (10.00/10 floor)
        entry: pylint
        language: system
        types: [python]
        files: ^scripts/.*\.py$
        pass_filenames: false
        # Mirrors ci.yml step 5a (added at the 2026-06-11 scripts/ lock-in).
        # Before this hook existed, a commit touching only scripts/*.py ran
        # zero local gates and failed only at PR time (polyglot audit
        # 2026-06-12, CI/PC-01 + HOOK/SH-09).
        args:
          - scripts/
          - --fail-under=10
          - --fail-on=E,F,shekel-decimal-from-float,shekel-refname-compare,shekel-bare-money-quantize,shekel-disable-rationale,shekel-transaction-status-bypass,shekel-ledger-model-bypass,shekel-unclassified-fenced-export,shekel-private-module-import
      - id: pylint-manual-harnesses
        name: pylint tests/manual/ (E/F only -- the proof instruments compile)
        entry: pylint
        language: system
        types: [python]
        files: ^tests/manual/.*\.py$
        pass_filenames: false
        # Mirrors ci.yml step 5a3 (ledger row P66, 2026-08-18). These are the
        # harnesses every cutover is verified with, run by hand against a
        # production CLONE and diffed -- and each probe's `_guard` records a
        # raise AS DATA, so a signature change makes a harness dump
        # {"RAISED": ...} where a figure belongs and a before/after diff of two
        # such runs reads BYTE-IDENTICAL over a region never measured. FOUR
        # sites were already dead when this gate was added, one since plan step
        # C2-f2d-3.
        #
        # E/F ONLY, not the 10.00/10 floor the three trees above hold: these
        # scripts legitimately duplicate one another and branch wide. What is
        # gated is the class that rotted them -- a call to a function that no
        # longer exists or no longer takes those arguments.
        args:
          - tests/manual/
          - --fail-on=E,F
          - --disable=all
          - --enable=E,F
      - id: pylint-checkers
        name: pylint checker package (10.00/10 floor)
        entry: pylint
        language: system
        types: [python]
        files: ^tools/pylint/shekel_checkers/.*\.py$
        pass_filenames: false
        # The custom checkers are the enforcement machinery; they hold the same
        # 10.00/10 floor they impose on app/ and scripts/ (mirrors ci.yml step
        # 5a2). Without this, a checker edit could silently regress the plugin
        # -- the R3 status-fence extension left it at 9.54 until the R10 package
        # split. Scoped to the shekel_checkers/ package; the tests/ subtree
        # stays out of general pylint scope (ratified decision #1) and runs
        # under the shekel-checker-tests pytest hook below.
        args:
          - tools/pylint/shekel_checkers/
          - --fail-under=10
          - --fail-on=E,F,shekel-decimal-from-float,shekel-refname-compare,shekel-bare-money-quantize,shekel-disable-rationale,shekel-transaction-status-bypass,shekel-ledger-model-bypass,shekel-unclassified-fenced-export,shekel-private-module-import
      - id: pylint-cross-tree-duplicates
        name: cross-tree duplicate-code (app/ + scripts/)
        entry: pylint
        language: system
        types: [python]
        files: ^(app|scripts)/.*\.py$
        pass_filenames: false
        # Mirrors ci.yml step 5c: only a COMBINED run can see an app/ <->
        # scripts/ duplication cluster (each tree's own whole-package run is
        # blind across the boundary). Detection verified on the
        # pre-consolidation commit when the CI gate was added.
        args:
          - app/
          - scripts/
          - --disable=all
          - --enable=duplicate-code
          - --fail-on=duplicate-code
          - --score=no
      - id: pylint-tests-decimals
        name: shekel-decimal-from-float on tests/
        entry: pylint
        language: system
        types: [python]
        files: ^tests/.*\.py$
        pass_filenames: false
        # tests/ are out of general pylint scope, but a Decimal built from a
        # float in a hand-computed assertion is a real bug. unknown/bad-option-value
        # are disabled explicitly so the test files' "disable=X -- explanation"
        # inline comments do not derail this targeted scan (--disable=all does not
        # cover option-validity meta-messages).
        args:
          - tests/
          - --disable=all
          - --enable=shekel-decimal-from-float
          - --disable=unknown-option-value,bad-option-value
      - id: shekel-checker-tests
        name: pylint checker unit tests
        entry: pytest
        language: system
        files: ^tools/pylint/.*\.py$
        pass_filenames: false
        args: [tools/pylint/tests, -c, /dev/null, -q]
      - id: pylint-quill
        name: pylint quill (10.00/10 floor)
        entry: pylint
        language: system
        types: [python]
        # tools/ci too: the tool imports the arc list from there.
        files: ^tools/(quill|ci)/.*\.py$
        pass_filenames: false
        # The private tracker's tooling (ruling balance:R-BAL170) holds the
        # 10.00/10 floor tools/pylint holds, from its first commit; ci.yml
        # step 4b runs the same command.
        args:
          - tools/quill/
          - --fail-under=10
          - --fail-on=E,F
      - id: quill-tests
        name: quill unit tests
        entry: pytest
        language: system
        files: ^tools/(quill|ci)/.*\.py$
        pass_filenames: false
        args: [tools/quill, -c, /dev/null, -q]
      # A commit on card/N names the task in progress there, stamped, and none
      # is made while no task is (ruling plan#1872; tools/quill/commit_hook.py,
      # its module docstring the rule).  prepare-commit-msg is the stage
      # `git commit --no-verify` does not skip, and commit-msg judges what the
      # editor leaves.  pre-commit passes the message file; always_run makes a
      # file it did not pass a failure (exit 2), never a skip.
      # It runs the checkout's own interpreter, `.venv/bin/python`, never
      # `python` off PATH, for the reason the pip tools below run theirs: a
      # shell without the venv active would run the host's, and no stage gets
      # past this hook (measured 2026-10-28: the host's python failed every
      # commit, "No module named 'cryptography'"; plan#1990).  And the hook
      # imports the standard library alone (its test runs it under
      # `python -S`), so no installed package can fail a commit.
      - id: quill-task
        name: a commit on card/N names its task in progress (quill start)
        entry: .venv/bin/python -m tools.quill.commit_hook
        language: system
        stages: [prepare-commit-msg, commit-msg]
        always_run: true
      # tools/ci: the verdict ci.yml runs, the archive banner, and the arc list
      # quill imports (step X-cx's L4).  The same 10.00/10 floor and the same
      # tests ci.yml step 4b runs.
      - id: pylint-ci
        name: pylint tools/ci (10.00/10 floor)
        entry: pylint
        language: system
        types: [python]
        files: ^tools/ci/.*\.py$
        pass_filenames: false
        args:
          - tools/ci/
          - --fail-under=10
          - --fail-on=E,F
      - id: ci-tests
        name: tools/ci unit tests
        entry: pytest
        language: system
        files: ^(tools/ci/.*\.py|\.github/workflows/.*\.ya?ml)$
        pass_filenames: false
        args: [tools/ci, -c, /dev/null, -q]
      # tools/release: what a release carries (step X-cx's L9a).  It reads
      # through tools/ci, tools/quill and the migration parser, so an edit to
      # any of them runs it.  The same 10.00/10 floor and
      # the same tests ci.yml step 4b runs.
      - id: pylint-release
        name: pylint tools/release (10.00/10 floor)
        entry: pylint
        language: system
        types: [python]
        files: ^tools/release/.*\.py$
        pass_filenames: false
        args:
          - tools/release/
          - --fail-under=10
          - --fail-on=E,F
      - id: release-tests
        name: tools/release unit tests
        entry: pytest
        language: system
        files: ^(tools/(release|ci|quill)/.*|scripts/migration_chain)\.py$
        pass_filenames: false
        args: [tools/release, -c, /dev/null, -q]
      # tools/split: the proved test-file split (step balance:X-er, ruling
      # R-BAL301).  The same 10.00/10 floor and the same tests ci.yml step 4b
      # runs; it reads tools/ci's repository root, so an edit there runs it too.
      - id: pylint-split
        name: pylint tools/split (10.00/10 floor)
        entry: pylint
        language: system
        types: [python]
        files: ^tools/split/.*\.py$
        pass_filenames: false
        args:
          - tools/split/
          - --fail-under=10
          - --fail-on=E,F
      - id: split-tests
        name: tools/split unit tests
        entry: pytest
        language: system
        files: ^tools/(split|ci)/.*\.py$
        pass_filenames: false
        args: [tools/split, -c, /dev/null, -q]
      # tools/rehearsal: the release rehearsal kit (step X-cx's K1).  The same
      # 10.00/10 floor and the same tests ci.yml step 4b runs, the ``cluster``
      # ones deselected there and here (they start a real private cluster;
      # ci.yml step 7c runs them, and by hand they run with ``-m cluster``).
      # The bench runs git through
      # tools/ci, so an edit there runs its tests too.
      - id: pylint-rehearsal
        name: pylint tools/rehearsal (10.00/10 floor)
        entry: pylint
        language: system
        types: [python]
        files: ^tools/rehearsal/.*\.py$
        pass_filenames: false
        args:
          - tools/rehearsal/
          - --fail-under=10
          - --fail-on=E,F
      - id: rehearsal-tests
        name: tools/rehearsal unit tests
        entry: pytest
        language: system
        files: ^tools/(rehearsal|ci)/.*\.py$
        pass_filenames: false
        args: [tools/rehearsal, -c, /dev/null, -q, -m, not cluster]

      # Every archived document says so on its first line (tools/ci/archive.py,
      # moved out of the plan gate when step X-cx's S3b deleted it): graded
      # when an archived document is added or edited, since a reader who
      # arrives by grep must be told before they read a word of it.  An edit
      # to the rule or its test runs tools/ci's tests above.
      - id: shekel-archive-banner
        name: an archived document says so on its first line
        entry: pytest
        language: system
        files: ^docs/(.*/)?(archive|historical)/.*\.md$
        pass_filenames: false
        args: [tools/ci/test_archive.py, -c, /dev/null, -q]

      # ── Polyglot-cleanup Phase 5 floors ─────────────────────────────
      # Non-Python linters adopted in docs/audits/polyglot-cleanup. Each
      # tool's config lives in its own file (.shellcheckrc, biome.jsonc,
      # .yamllint, .djlintrc, .gitleaks.toml, _typos.toml, .hadolint.yaml),
      # plus .djlint_rules.yaml, which carries this project's own djlint
      # rule SHK01 (inline styles; bank_import:N-405).
      # All run language:system. The host binaries (shellcheck, shfmt,
      # biome, typos, gitleaks, hadolint) come off PATH; the pip tools
      # (yamllint, jactionlint, zizmor, djlint, rumdl) are invoked as
      # `.venv/bin/<tool>` -- the repo's locked copy from uv.lock
      # -- and NOT off PATH, because a shell without the venv first on PATH
      # would otherwise run the host's package at whatever version Arch
      # ships (measured 2026-09-20: rumdl 0.2.73 on the host against 0.2.74
      # pinned, and the two reject each other's line wrapping), failing a
      # commit for a reason belonging to neither the author nor CI. Every
      # checkout carries `.venv` (CLAUDE.md: a worktree symlinks the main
      # one), so the path is the one home of each pin and the host package
      # is irrelevant. These mirror the ci.yml polyglot-lint job, which
      # installs the same pins; CI remains the enforced gate.
      - id: shellcheck
        name: shellcheck (shell; masked-errexit groups via .shellcheckrc)
        entry: shellcheck
        language: system
        types: [shell]
      - id: shfmt
        name: shfmt (shell format check)
        entry: shfmt -d -i 4 -ci -bn
        language: system
        types: [shell]
      - id: yamllint
        name: yamllint
        entry: .venv/bin/yamllint
        language: system
        types: [yaml]
      - id: jactionlint
        name: jactionlint (GitHub workflows)
        # Its profile is .github/jactionlint.yaml's (ruling plan#2355).  The
        # whole .github/ tree fires it, as it does zizmor: a run with no
        # operands checks dependabot.yml beside the workflows, and the config
        # file is itself under .github/.  Naming shellcheck makes a missing
        # one exit 3 rather than skip its rule unsaid, as in ci.yml.
        entry: .venv/bin/jactionlint --shellcheck=shellcheck
        language: system
        files: ^\.github/.*\.ya?ml$
        pass_filenames: false
      - id: zizmor
        name: zizmor (workflow security)
        # The whole .github/ tree, not workflows/ alone: zizmor audits
        # dependabot.yml too (its dependabot-cooldown rule), and a path
        # scoped to workflows/ left that file ungated (deps refresh 2026-09-20).
        entry: .venv/bin/zizmor --offline .github/
        language: system
        files: ^\.github/.*\.ya?ml$
        pass_filenames: false
      - id: biome
        name: biome lint (JS + CSS)
        entry: biome lint app/static/js app/static/css
        language: system
        files: ^app/static/(js|css)/.*\.(js|css)$
        pass_filenames: false
      - id: hadolint
        name: hadolint (Dockerfile)
        # hadolint is AUR-only (no pip/pacman package), so skip with a loud
        # notice if the host binary is absent rather than blocking every
        # local commit. The ci.yml polyglot-lint job installs a pinned
        # hadolint and hard-enforces it -- CI is the authoritative gate for
        # this surface (install locally with: yay -S hadolint-bin).
        entry: bash -c 'if command -v hadolint >/dev/null 2>&1; then hadolint "$@"; else echo "hadolint not installed (yay -S hadolint-bin) -- skipped locally; CI enforces."; fi' --
        language: system
        files: ^Dockerfile$
      - id: gitleaks
        name: gitleaks (committed-secret scan)
        entry: gitleaks dir . --no-banner --redact
        language: system
        pass_filenames: false
      - id: typos
        name: typos (content spell check)
        entry: typos
        language: system
        pass_filenames: false
      - id: djlint
        name: djlint (Jinja templates, lint-only)
        entry: .venv/bin/djlint --lint
        language: system
        files: ^app/templates/.*\.html$
      - id: jinja-syntax
        name: jinja2 template parse check
        entry: python scripts/check_template_syntax.py
        language: system
        files: ^app/templates/.*\.html$
        pass_filenames: false
      - id: rumdl
        name: rumdl (Markdown lint + format check)
        # rumdl scans the whole tree honoring .rumdl.toml excludes, so it runs
        # unfiltered (pass_filenames: false); the files key just gates WHEN the
        # hook fires (any staged Markdown change).
        entry: .venv/bin/rumdl check
        language: system
        files: \.md$
        pass_filenames: false
