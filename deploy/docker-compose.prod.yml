# Shekel Budget App -- Shared-Mode Compose Override
#
# DEPLOYMENT ROLE
# ---------------
# This file is the version-controlled copy of the production compose
# override that runs on the maintainer's homelab host.  It composes
# WITH the repo's docker-compose.yml -- it does not replace it.
#
# Runtime path:    /opt/docker/shekel/docker-compose.override.yml
# Compose project: shekel-prod (set by the base docker-compose.yml).
#
# Renamed from "docker-compose.override.yml" to "docker-compose.prod.yml"
# so its role is explicit when read in isolation: this is the override
# that distinguishes shared-Nginx production from the bundled-Nginx
# fresh-host bring-up.  In bundled mode this file is NOT used -- the
# repo's docker-compose.yml runs by itself.
#
# WHAT IT CHANGES
# ---------------
# 1. shekel-prod-app joins the dedicated ``shekel-frontend`` bridge
#    (instead of the shared ``homelab`` network) so the app is reachable
#    only by the shared /opt/docker/nginx container and the cloudflared
#    tunnel sidecar -- both attached to ``shekel-frontend`` from
#    /opt/docker/docker-compose.yml.  This isolates the app from
#    co-tenants like jellyfin / immich / unifi that still live on the
#    homelab bridge.  Audit findings F-020, F-129, F-063, Commit C-33.
#
# 2. The bundled shekel-prod-nginx service is parked in the "disabled"
#    profile so ``docker compose up`` does not start it.  The shared
#    /opt/docker/nginx container (defined in /opt/docker/docker-compose.yml)
#    is the only Nginx in this deployment.
#
# 3. Gunicorn's FORWARDED_ALLOW_IPS is repinned from the bundled
#    default (the ``backend`` bridge) to the ``shekel-frontend`` bridge
#    that actually carries the proxy hop in shared mode.
#    See the gunicorn.conf.py block-comment for the full rationale.
#
# 4. Every password comes from a file under secrets/ (DOCKER SECRETS
#    below), each mounted only into the services that use it, and the
#    migrate service, the deploy, runs the app's pinned image (IMAGE
#    DIGEST PINNING below).
#
# OPERATOR PRE-FLIGHT (one-time, when first switching to shared mode)
# -------------------------------------------------------------------
# 1. Create the shekel-frontend network on the host with a pinned subnet:
#
#        docker network create shekel-frontend \
#            --driver bridge \
#            --subnet 172.32.0.0/24
#
#    The subnet matches FORWARDED_ALLOW_IPS below and the
#    ``set_real_ip_from`` directive in deploy/nginx-shared/nginx.conf.
#
# 2. Edit /opt/docker/docker-compose.yml so the ``nginx`` and
#    ``cloudflared`` services join shekel-frontend in addition to the
#    homelab network they already use:
#
#        services:
#          nginx:
#            networks:
#              - homelab
#              - shekel-frontend
#          cloudflared:
#            networks:
#              - homelab
#              - shekel-frontend
#        networks:
#          shekel-frontend:
#            external: true
#
#    Recreate the affected containers:
#
#        cd /opt/docker
#        docker compose up -d nginx cloudflared
#
# 3. Update /opt/docker/cloudflared/config.yml so the shekel ingress
#    rule points to the shared Nginx instead of straight at gunicorn:
#
#        - hostname: shekel.saltyreformed.com
#          service: http://nginx:80
#
#    Restart cloudflared:
#
#        cd /opt/docker
#        docker compose up -d cloudflared
#
# Without these three steps the WAN path will 404 and Gunicorn will
# refuse start (FORWARDED_ALLOW_IPS without a matching reverse-proxy
# source = no trusted forwarded headers).  See docs/runbook/2_deployment.md "Shared-
# mode deployment" for the rollback procedure.
#
# USAGE
# -----
# On the host:
#   cd /opt/shekel
#   docker compose \
#     -f docker-compose.yml \
#     -f deploy/docker-compose.prod.yml \
#     up -d
#
# Or with the runtime override copy in /opt/docker/shekel/, where compose
# auto-loads docker-compose.override.yml:
#   cd /opt/docker/shekel
#   docker compose up -d
#
# Either invocation must produce the same merged config.  See
# docs/runbook/2_deployment.md "Shared-mode deployment" for the sync procedure that
# keeps the on-host override in step with this file.
#
# CONTAINER HARDENING INHERITANCE (Commit C-35)
# ---------------------------------------------
# This override does NOT redeclare the ``security_opt``,
# ``cap_drop``, ``read_only``, ``tmpfs``, ``mem_limit``,
# ``pids_limit``, ``logging``, or ``user`` settings from the base
# docker-compose.yml.  Compose merges per-key by default for those
# scalars; the only keys this file sets are ``image`` (pin to
# digest), ``environment.*``, ``secrets``, ``networks`` (replaces
# the app's list), ``profiles`` (adds disabled to nginx), and the
# db's ``command`` and ``volumes``.  Every hardening field on the
# app, migrate and db services flows through to the shared-mode
# runtime unchanged.  Verified by ``docker
# compose -f docker-compose.yml -f deploy/docker-compose.prod.yml
# config`` and by the test suite under
# tests/test_deploy/test_container_hardening.py.
#
# IMAGE DIGEST PINNING (Commit C-36 / audit findings F-060, F-155)
# ----------------------------------------------------------------
# Shared-mode production replaces the base file's ``:latest`` tag
# with an immutable ``@sha256:<digest>`` reference, sourced from
# the host ``.env`` via the ``SHEKEL_IMAGE_DIGEST`` interpolation
# below, on the app and on the migrate service, which runs the
# app's image (the anchor on the app's ``image:`` line).  The ``:?`` syntax FAILS the compose parse loudly if the
# variable is missing or empty: that is intentional -- a missing
# digest in production would silently fall back to whatever
# ``:latest`` resolved to at the time of pull, defeating both the
# audit fix and any downstream Cosign verification.
#
# Operator workflow:
#   1. After CI builds and signs a new image, capture the digest it
#      emits, in the ``Build & Publish Docker Image`` workflow's
#      "Image digest" step output.
#   2. On the host, edit /opt/docker/shekel/.env and set:
#        SHEKEL_IMAGE_DIGEST=sha256:abc123...
#      (the value INCLUDES the ``sha256:`` prefix; the ``image:``
#      line below already supplies the ``@`` separator).
#   3. Re-run ``docker compose -f docker-compose.yml -f
#      docker-compose.override.yml up -d`` to roll the app
#      container to the new digest.
#   4. Verify the running image via ``docker inspect
#      shekel-prod-app --format '{{.Image}}'`` -- the output digest
#      must match the value pinned in .env.
#
# See deploy/README.md "Image digest pinning" for the full
# rotation procedure including Cosign verify and rollback.
#
# POSTGRES TLS (Commit C-37 / audit finding F-154)
# ------------------------------------------------
# Shared-mode production enables Postgres TLS so the
# Gunicorn -> Postgres hop is encrypted on the wire even though it
# stays inside a single internal Docker bridge.  The base
# ``docker-compose.yml`` keeps Postgres on plaintext TCP for the
# README Quick Start (where a fresh-host operator does not yet
# have a cert generated).  This override layers TLS on top:
#
#   1. ``services.db.command`` runs ``postgres -c ssl=on -c
#      ssl_cert_file=... -c ssl_key_file=...`` so the postgres
#      process loads the operator-provided cert at startup.
#   2. ``services.db.volumes`` adds two read-only bind mounts that
#      expose ``deploy/postgres/server.crt`` and ``server.key`` at
#      the paths referenced above.
#   3. ``DB_SSLMODE=require`` on the app and migrate services puts
#      ``?sslmode=require`` on the URL each entrypoint builds
#      (scripts/_entrypoint_lib.sh): the web login's DATABASE_URL_APP
#      and the owner's DATABASE_URL, so the SQLAlchemy engine refuses
#      any cleartext connection.  ``PGSSLMODE=require`` gives the same
#      mode to every libpq connection that names none: the deploy's
#      ``psql`` (scripts/deploy.sh) and each entrypoint's wait.
#
# Operator pre-flight (one-time, before the first
# ``docker compose up`` in shared mode):
#
#     # Generate the self-signed cert.  Requires sudo because
#     # the key file must be chowned to the postgres user (uid 70
#     # in postgres:18-alpine) for postgres to accept it.
#     sudo ./scripts/generate_pg_cert.sh
#
#     # The script writes deploy/postgres/server.crt (mode 0644)
#     # and deploy/postgres/server.key (mode 0600 owned by uid 70)
#     # so the bind mount preserves the ownership Postgres requires.
#
# Cert rotation: re-run the script with ``--force`` after the
# certificate's ``--days`` window expires.  See
# ``scripts/generate_pg_cert.sh`` for the full lifecycle.
#
# Existing pgdata volume note: ``POSTGRES_INITDB_ARGS`` only
# influences a fresh ``initdb``.  Re-using the
# ``shekel-prod-pgdata`` volume from a pre-C-37 deployment does NOT
# rewrite the cluster -- the TLS posture above still applies (the
# postgres process re-reads ssl_cert_file on every restart) but
# data checksums must be enabled offline via ``pg_checksums --enable``
# during a planned outage if desired.  This is intentionally NOT
# automated here: data-checksums is an opt-in operational decision.
#
# DOCKER SECRETS (Commit C-38 / audit findings F-148, F-109)
# ----------------------------------------------------------
# Shared-mode production reads its secrets from operator-managed
# files under ``/opt/docker/shekel/secrets/`` instead of the host
# ``.env`` file, and mounts each into the services that use it and no
# other (rulings plan#3412, plan#3413):
#
#   secret_key           app
#   totp_encryption_key  app
#   valkey_password      app, valkey
#   app_role_password    app (logs in with it), db (sets it)
#   owner_role_password  migrate (logs in with it), db (sets it)
#   postgres_password    db alone: the superuser's never leaves it
#
# The audit's threat model: ``Container.Config.Env`` (visible via
# ``docker inspect``) and the on-disk ``.env`` file are the two
# channels through which a secret leaks beyond the running container;
# Docker secrets close both -- the file at rest stays under the 0700
# secrets/ directory, and ``docker inspect`` shows at most the
# placeholder the operator left in ``.env`` to satisfy the base
# file's ``${VAR:?...}`` interpolation.
#
# How the migration works in practice:
#   * The base ``docker-compose.yml`` continues to reference each
#     secret via ``${VAR:?...}`` interpolation -- compose validates
#     at config-time that the variable is set.  Operators using
#     docker secrets put a non-empty PLACEHOLDER (any string) in
#     ``.env`` so the interpolation succeeds.  The app's entrypoint
#     overwrites its placeholders from the files; this file blanks
#     the db's and the migrate service's, so neither container holds
#     one.
#   * The db service uses the postgres image's native
#     ``POSTGRES_PASSWORD_FILE`` env var -- the image's
#     ``docker-entrypoint.sh`` reads the file and exports the value.
#     We must override the base file's ``POSTGRES_PASSWORD`` to an
#     empty string so the postgres image's "both set" exclusivity
#     check passes (it errors when both ``POSTGRES_PASSWORD`` and
#     ``POSTGRES_PASSWORD_FILE`` are non-empty).  Its provisioning
#     script, deploy/postgres/provision_roles.sh, reads the two
#     logins' passwords from their files.
#   * The app and migrate services' entrypoints read each
#     ``/run/secrets/<name>`` file with ``_load_secret``
#     (scripts/_entrypoint_lib.sh) and export the value into env
#     before their checks and the URL each builds.
#
# Operator pre-flight (one-time, when first migrating to docker
# secrets -- see ``docs/runbook_secrets.md`` "Migrating to Docker
# secrets" for the end-to-end procedure):
#
#     # Create the secrets directory with restrictive permissions,
#     # OWNED BY THE OPERATING USER (the uid that runs ``docker
#     # compose``), not root -- the deployed reality on the homelab
#     # host is josh:josh 0700.
#     install -d -m 0700 /opt/docker/shekel/secrets
#
#     # Write each secret value.  ``printf`` (no trailing newline) is
#     # preferred so the file content matches the exact secret bytes;
#     # the loaders strip a trailing newline if ``echo`` was used by
#     # mistake but printf-style is the documented form.
#     printf '%s' '<SECRET_KEY-value>'        > /opt/docker/shekel/secrets/secret_key
#     printf '%s' '<POSTGRES_PASSWORD-value>' > /opt/docker/shekel/secrets/postgres_password
#     printf '%s' '<APP_ROLE_PASSWORD-value>' > /opt/docker/shekel/secrets/app_role_password
#     printf '%s' '<OWNER_ROLE_PASSWORD-value>' > /opt/docker/shekel/secrets/owner_role_password
#     printf '%s' '<TOTP_ENCRYPTION_KEY-value>' > /opt/docker/shekel/secrets/totp_encryption_key
#
#     # File modes: compose v2 (non-Swarm) IGNORES the uid:/gid:/mode:
#     # fields on a secret reference -- the container sees the HOST
#     # file's ownership and mode (see .claude/rules/deploy.md).  The
#     # secrets the app image alone reads are read by uid 1000 (the
#     # ``shekel`` user), which matches the operating user's uid, so
#     # 0600 works:
#     chmod 0600 /opt/docker/shekel/secrets/secret_key \
#                /opt/docker/shekel/secrets/totp_encryption_key
#     # The three the DB container reads, as uid 70 (postgres), which
#     # cannot read a josh-owned 0600 file.  Either chown each to 70
#     # with mode 0600, which would shut out the app image's uid 1000
#     # from the two it also reads, or leave them 0644 and rely on the
#     # 0700 directory for containment -- the deployed posture is the
#     # latter:
#     chmod 0644 /opt/docker/shekel/secrets/postgres_password \
#                /opt/docker/shekel/secrets/app_role_password \
#                /opt/docker/shekel/secrets/owner_role_password
#
#     # Replace the real values in /opt/docker/shekel/.env with
#     # placeholder strings so the base file's ${VAR:?...}
#     # interpolation still passes.  Any non-empty string works;
#     # ``replaced_by_docker_secret`` is the documented choice so a
#     # forensic reader sees the intent immediately.
#     SECRET_KEY=replaced_by_docker_secret
#     POSTGRES_PASSWORD=replaced_by_docker_secret
#     APP_ROLE_PASSWORD=replaced_by_docker_secret
#     OWNER_ROLE_PASSWORD=replaced_by_docker_secret
#
# TOTP_ENCRYPTION_KEY_OLD note: this variable is empty in steady
# state (populated only during a documented rotation, see
# ``docs/runbook_secrets.md`` "Rotating TOTP_ENCRYPTION_KEY").  It is
# NOT included in the secrets block below because compose's
# file-based secrets require the file to exist at ``docker compose
# up`` time -- declaring it as a secret would force the operator to
# touch an empty file even when they are not rotating.  During an
# active rotation, the operator may inline-add it to the secrets
# block below, write the retired key to
# ``/opt/docker/shekel/secrets/totp_encryption_key_old``, and revert
# the inline edit after ``scripts/rotate_totp_key.py`` reports zero
# skipped rows.  The entrypoint's ``_load_secret`` helper reads
# ``/run/secrets/totp_encryption_key_old`` on every start, so the
# inline edit is the only step required when one is needed.

services:
  # ── PostgreSQL with TLS enabled (Commit C-37 / F-154) ───────────
  # Layer ``ssl=on`` plus the cert/key file directives onto the base
  # ``postgres:18-alpine`` service.  Compose performs additive merges
  # for ``volumes`` (the named ``shekel-prod-pgdata`` mount declared
  # in the base file is preserved), and ``command`` is unset on the
  # base service so the override below is the only command Postgres
  # sees.  ``environment`` is mapping-merged so the existing
  # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB values survive.
  db:
    # Postgres command-line directives.  The image's built-in
    # ``docker-entrypoint.sh`` accepts an explicit ``postgres ...``
    # argv and exec's it after handling the chown / initdb steps.
    # Each ``-c`` flag becomes a runtime ``postgresql.conf`` setting
    # so we do not need to mount or template a config file.
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/postgresql/certs/server.crt
      - -c
      - ssl_key_file=/etc/postgresql/certs/server.key
      # ssl_ciphers and ssl_min_protocol_version pin the cipher
      # suite and TLS floor so a future libssl upgrade cannot
      # silently re-enable a weaker default.  TLSv1.2+ matches
      # ASVS L2 V9.1.2; the cipher list below is the OpenSSL
      # MOZILLA_INTERMEDIATE preset minus 3DES / SHA1.
      - -c
      - ssl_min_protocol_version=TLSv1.2
      - -c
      - ssl_ciphers=HIGH:!aNULL:!eNULL:!MD5:!3DES:!SHA1
    environment:
      # Enable Postgres data checksums on FRESH cluster init only.
      # postgres-entrypoint.sh forwards this string to ``initdb``
      # the first time the volume is empty.  An existing
      # ``shekel-prod-pgdata`` volume keeps its prior checksum
      # state; the operator must run ``pg_checksums --enable``
      # offline to retro-fit the setting on a populated cluster.
      # See the file-level comment for the rationale.
      POSTGRES_INITDB_ARGS: "--data-checksums"
      # Docker secrets handoff (Commit C-38 / F-148).  The postgres
      # image's docker-entrypoint.sh reads ``POSTGRES_PASSWORD_FILE``
      # natively and exports its content as ``POSTGRES_PASSWORD`` to
      # the ``postgres`` process.  Override the base file's
      # ``POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?...}`` to the empty
      # string so the image's "both set" exclusivity check
      # (file_env in docker-entrypoint.sh: errors when both
      # POSTGRES_PASSWORD and POSTGRES_PASSWORD_FILE are non-empty)
      # falls through to the file-backed branch.  The operator's
      # .env still supplies a placeholder POSTGRES_PASSWORD to
      # satisfy the base file's ``${POSTGRES_PASSWORD:?...}``
      # interpolation; the override here zeroes it out before the
      # postgres image sees it.
      POSTGRES_PASSWORD: ""
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      # The two logins' passwords: deploy/postgres/provision_roles.sh
      # reads each from its file below, and blanking the variables keeps
      # .env's placeholder out of this container's stored environment, so
      # a missing file is refused as empty rather than set as a password.
      OWNER_ROLE_PASSWORD: ""
      APP_ROLE_PASSWORD: ""
    # The superuser's password, for the image, and the two logins'
    # passwords, for the provisioning script: the only service given
    # postgres_password (ruling plan#3412).  Compose ignores a file
    # secret's uid, gid and mode outside Swarm (it says so on every
    # ``config``), so the container sees each host file's own owner and
    # mode, and the postgres user (uid 70) reads these three only because
    # the host files are 0644 inside the 0700 secrets/ directory (the
    # file-level DOCKER SECRETS block).
    secrets:
      - source: postgres_password
        target: postgres_password
      - source: owner_role_password
        target: owner_role_password
      - source: app_role_password
        target: app_role_password
    volumes:
      # Shared-mode TLS material.  Mounts the operator-generated
      # cert and key read-only into the canonical Postgres cert
      # path.  ``deploy/postgres/server.{crt,key}`` is gitignored
      # (private key) and produced by ``scripts/generate_pg_cert.sh``;
      # the script chowns the key to uid 70 so the postgres process
      # in the container can read it under the file's mandatory
      # 0600 mode.
      - ./deploy/postgres/server.crt:/etc/postgresql/certs/server.crt:ro
      - ./deploy/postgres/server.key:/etc/postgresql/certs/server.key:ro

  # ── Valkey's password from production's password file ───────────
  # The base file hands the valkey service and the app their one
  # password in the environment variable VALKEY_PASSWORD, from .env.
  # Production mounts it into both from one file under secrets/ instead,
  # as it reads its other secrets (Commit C-38), and blanks both
  # variables so neither container's stored environment (``docker
  # inspect``) holds the password: start.sh reads the file when one is
  # mounted, and so does entrypoint.sh's _load_secret, for the app
  # (ruling plan#2633).  .env keeps a placeholder, which the base file's
  # ``${SHEKEL_VALKEY_PASSWORD:?...}`` needs and neither container sees.
  # Everything else is the base file's: the rules (deploy/valkey/
  # users.acl, their one home, ruling plan#2350, read here from the
  # host copy /opt/docker/shekel/deploy/valkey/), start.sh, which
  # hashes this file's password into them, and the server flags.
  #
  # The password file, 0640, and the host copy of deploy/valkey/ are
  # made by scripts/reconcile_prod_to_canonical.sh (steps 3 and 7) on a
  # fresh host, and by the Valkey cutover (docs/runbook/2_deployment.md 2.6) on the
  # host that ran Redis.
  # Mode rationale: compose v2 ignores the uid/gid/mode fields on a file
  # secret's reference; the container sees the HOST file.  The valkey
  # image runs as uid 999 gid 1000, and gid 1000 is the operating
  # user's group on this host, so 0640 group-read suffices -- no
  # world-readable bit, and the 0700 secrets/ directory contains the
  # rest.  The app runs as uid 1000, the file's owner.
  valkey:
    environment:
      VALKEY_PASSWORD: ""
    secrets:
      - source: valkey_password
        target: valkey_password

  app:
    # Pin to an immutable digest sourced from .env.  ``${VAR:?...}``
    # makes the missing-variable case a hard parse failure with a
    # clear remediation message, matching the rest of the compose
    # stack's required-secret handling (SECRET_KEY, POSTGRES_PASSWORD,
    # APP_ROLE_PASSWORD).  Audit findings F-060, F-155 / Commit C-36.
    # The anchor is the pin's one home in this file: the migrate service
    # below runs the same digest, so the deploy and the web server are one
    # build.
    image: &shekel-image ghcr.io/saltyreformed-labs/shekel@${SHEKEL_IMAGE_DIGEST:?Set SHEKEL_IMAGE_DIGEST=sha256:... in /opt/docker/shekel/.env to pin the production image (audit finding F-060). See deploy/README.md "Image digest pinning" for the procedure.}
    environment:
      # Pin the app's civil timezone (parity audit 2026-06-12, finding
      # M01 in shekel-audits/dev-prod-parity/findings.md).  The image
      # default is UTC, which flipped ``date.today()`` to the next day
      # at 20:00 America/New_York (19:00 in winter), so date-defaulted
      # entries, pay-period membership, and staleness flags disagreed
      # with the operator's wall clock for four hours nightly.  The
      # app's date logic is naive process-local time throughout, so the
      # process timezone IS the app timezone.  tzdata ships in
      # python:3.14-slim (verified: /usr/share/zoneinfo/America/New_York
      # exists in the running image).  docker-compose.dev.yml pins the
      # same value so dev and prod compute identical calendar dates.  The
      # anchor is its one home in this file: the deploy runs the app's
      # code (the migrations, the seed) and computes the same dates.
      TZ: &civil-timezone America/New_York
      # Shared mode: the in-stack ``backend`` bridge no longer carries
      # the reverse-proxy hop -- the shared /opt/docker/nginx talks to
      # the app over ``shekel-frontend``.  Override the bundled-mode
      # default with the shared subnet so Gunicorn keeps refusing
      # X-Forwarded-* from any source other than the shared nginx /
      # cloudflared sidecar.  Audit finding F-015, Commit C-33.
      FORWARDED_ALLOW_IPS: 172.32.0.0/24
      # ── Postgres TLS (Commit C-37 / F-154) ────────────────────
      # entrypoint.sh builds the URL the server connects by,
      # DATABASE_URL_APP, with ``?sslmode=`` and this value
      # (scripts/_entrypoint_lib.sh), so SQLAlchemy / psycopg (libpq)
      # refuse any connection the postgres server cannot upgrade to TLS.
      # ``require`` is the strict-but-not-cert-verifying mode appropriate
      # for the self-signed cert generated by
      # ``scripts/generate_pg_cert.sh``: the channel is encrypted but
      # libpq does not validate the cert chain (which would require
      # shipping the CA pem to every client and is operationally costly
      # for a single-host deployment).  The anchor is the mode's one home
      # in this file: the migrate service below connects under it too.
      DB_SSLMODE: &tls-mode require
      # Blanked: the app reads the store's password from the
      # valkey_password file below, as the valkey service does (see its
      # block above), so its stored environment holds none.
      VALKEY_PASSWORD: ""
      # Standard libpq env var: the mode of every libpq connection this
      # container makes without naming one, as the entrypoint's wait
      # (pg_isready) and an operator's psql do.
      PGSSLMODE: *tls-mode
    secrets:
      # The web server's own secrets, and no other (rulings plan#3412,
      # plan#3413): no superuser or owner password.  Exposed as files
      # under /run/secrets/<name>; ``_load_secret``
      # (scripts/_entrypoint_lib.sh) reads each file at container start
      # and exports the value into env BEFORE entrypoint.sh's SECRET_KEY
      # / APP_ROLE_PASSWORD shape checks.  See the file-level "DOCKER
      # SECRETS" comment block above for the threat-model rationale and
      # the operator pre-flight commands.  Audit finding F-148 / Commit
      # C-38.
      #
      # Compose ignores a file secret's uid, gid and mode outside Swarm,
      # so the container sees each host file's own owner and mode: the
      # app's user, uid 1000 (the Dockerfile's ``USER 1000:1000``), reads
      # them as the host files' owner, the operating user, uid 1000 too.
      - source: secret_key
        target: secret_key
      - source: app_role_password
        target: app_role_password
      - source: totp_encryption_key
        target: totp_encryption_key
      - source: valkey_password
        target: valkey_password
    networks:
      - backend
      - shekel-frontend

  # ── The deploy, as production runs it ───────────────────────────
  # The app's pinned image, under the app's timezone and TLS mode (their
  # anchors, above), with the owner's password from its file and no
  # other secret (rulings plan#3412, plan#3413).  It stays on the base
  # file's backend network alone: it reaches the database and nothing
  # the shared nginx or the tunnel can reach.  Everything else, the
  # hardening included, is the base file's.
  migrate:
    image: *shekel-image
    environment:
      TZ: *civil-timezone
      # The owner's URL takes ``?sslmode=`` from DB_SSLMODE
      # (scripts/_entrypoint_lib.sh), and the deploy's psql takes its
      # mode from PGSSLMODE (scripts/deploy.sh).
      DB_SSLMODE: *tls-mode
      PGSSLMODE: *tls-mode
      # Blanked: the entrypoint reads the owner's password from the
      # owner_role_password file below, so this container's stored
      # environment holds no placeholder, and a missing file is refused
      # as unset rather than tried as a password.
      OWNER_ROLE_PASSWORD: ""
    secrets:
      # Read by the app image's user, uid 1000, as the host file's owner;
      # the db's user, uid 70, reads it through the file's 0644 mode (the
      # file-level DOCKER SECRETS block).
      - source: owner_role_password
        target: owner_role_password

  nginx:
    profiles: ["disabled"]

# ── Top-level secrets block (Commit C-38 / F-148) ─────────────────
# Each secret is backed by a host file under /opt/docker/shekel/
# secrets/.  The path matches the docs/runbook_secrets.md "Migrating
# to Docker secrets" pre-flight commands; operators who relocate
# their compose files must update the paths here in lockstep.
#
# ``file:`` semantics: compose REQUIRES each referenced file to
# exist at ``docker compose up`` time -- a missing file fails the
# parse with ``error decoding 'secrets': no such file or directory``.
# The readers, the entrypoints' ``_load_secret``
# (scripts/_entrypoint_lib.sh) and provision_roles.sh's
# ``_password``, handle the "file present but empty" case (reject
# with a clear error), the "file missing" case (fall back to env,
# which this file blanks wherever it mounts the file), and the "file
# readable" case (load and export).
secrets:
  secret_key:
    file: /opt/docker/shekel/secrets/secret_key
  postgres_password:
    file: /opt/docker/shekel/secrets/postgres_password
  app_role_password:
    file: /opt/docker/shekel/secrets/app_role_password
  # The database owner's password: provision_roles.sh sets it in the db
  # service, and the migrate service logs in with it.
  owner_role_password:
    file: /opt/docker/shekel/secrets/owner_role_password
  totp_encryption_key:
    file: /opt/docker/shekel/secrets/totp_encryption_key
  # Valkey's password, which start.sh hashes into the ACL and the app
  # logs in with (see the valkey service above).
  valkey_password:
    file: /opt/docker/shekel/secrets/valkey_password

networks:
  # External pre-existing bridge that hosts the shared /opt/docker/nginx
  # container, the cloudflared tunnel sidecar, and the shekel app.
  # Nothing else -- co-tenants like jellyfin/immich/unifi stay on the
  # homelab bridge.  Audit findings F-020, F-129, Commit C-33.
  #
  # The operator must create this network manually before the first
  # ``docker compose up`` (see "OPERATOR PRE-FLIGHT" above):
  #
  #     docker network create shekel-frontend \
  #         --driver bridge \
  #         --subnet 172.32.0.0/24
  #
  # ``external: true`` declares that compose does NOT manage the
  # network; ``name: shekel-frontend`` strips the project prefix so it
  # matches the literal name the host-level compose attaches to.
  shekel-frontend:
    external: true
    name: shekel-frontend
